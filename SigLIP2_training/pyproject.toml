[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "siglip2-training"
version = "0.1.0"
description = "Reproducible streaming and preprocessing pipeline for full-catalog SigLIP2 training"
requires-python = ">=3.11,<3.12"
dependencies = [
  "Pillow==11.3.0",
  "PyYAML==6.0.3",
  "requests==2.34.2",
  "transformers==4.57.6",
]

[project.optional-dependencies]
training = [
  "numpy==1.26.4",
  "pandas==2.2.3",
  "safetensors==0.8.0",
  "torch==2.2.2",
]
parquet = ["pyarrow>=17,<20"]

[project.scripts]
siglip2-training = "siglip2_training.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
