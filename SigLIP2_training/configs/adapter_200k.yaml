seed: 42

runtime:
  device_preference:
    - mps
    - cpu
  batch_size: 256
  epochs: 30
  early_stopping_patience: 6

adapter:
  bottleneck_dimension: 128
  dropout: 0.05
  learning_rate: 0.001
  weight_decay: 0.0001
  maximum_logit_scale: 200.0

candidates:
  - name: taxonomy_w20_random_200k
    strategy: multichunk_with_taxonomy
    taxonomy_weight: 0.20
    seed_offset: 0
    batching:
      mode: random

reference:
  label: selected_50k_incumbent
  strategy: multichunk_with_taxonomy
  taxonomy_weight: 0.20
  batching:
    mode: random
  checkpoint: checkpoints/pilot_50k/multichunk_with_taxonomy.pt

reference_comparison:
  maximum_recall_at_1_regression_percentage_points: 3.0
  maximum_recall_at_10_regression_percentage_points: 2.0
  maximum_taxonomy_precision_at_10_regression_percentage_points: 3.0
  maximum_supported_slice_regression_percentage_points: 5.0

evaluation:
  bootstrap_resamples: 5000
  confidence_level: 0.95
