seed: 42

runtime:
  device_preference:
    - mps
    - cpu
  batch_size: 256
  epochs: 50
  early_stopping_patience: 8

adapter:
  bottleneck_dimension: 128
  dropout: 0.05
  learning_rate: 0.001
  weight_decay: 0.0001
  maximum_logit_scale: 200.0

strategies:
  - raw_first_64
  - canonical_64
  - multichunk_64
  - multichunk_with_taxonomy

multichunk_with_taxonomy:
  taxonomy_weight: 0.20

evaluation:
  bootstrap_resamples: 5000
  confidence_level: 0.95
